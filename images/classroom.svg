<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
          <defs>
            <linearGradient id="crWall" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#252e4c"/><stop offset="1" stop-color="#1a2139"/>
            </linearGradient>
            <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#26315a"/>
            </linearGradient>
          </defs>
          <rect width="1600" height="900" fill="url(#crWall)"/>
          <rect x="0" y="640" width="1600" height="260" fill="#141a2e"/>
          <rect x="0" y="632" width="1600" height="10" fill="#0d1120"/>

          <!-- window (flavor) -->
          <g>
            
            <rect x="80" y="150" width="250" height="370" fill="url(#nightSky)"/>
            <circle cx="270" cy="210" r="26" fill="#f3ead8" opacity="0.9"/>
            <g fill="#f3ead8" opacity="0.7"><circle cx="120" cy="190" r="2"/><circle cx="170" cy="240" r="1.6"/><circle cx="220" cy="180" r="1.8"/><circle cx="140" cy="290" r="1.4"/></g>
            <g fill="#0d1120"><rect x="80" y="400" width="70" height="120"/><rect x="150" y="360" width="60" height="160"/><rect x="210" y="420" width="120" height="100"/></g>
            <g fill="#f2b35b" opacity="0.8"><rect x="165" y="380" width="8" height="10"/><rect x="185" y="410" width="8" height="10"/><rect x="230" y="440" width="8" height="10"/></g>
            <g stroke="#3d4566" stroke-width="10" fill="none"><rect x="80" y="150" width="250" height="370"/><line x1="205" y1="150" x2="205" y2="520"/><line x1="80" y1="335" x2="330" y2="335"/></g>
          </g>

          <!-- whiteboard (hotspot) -->
          <g>
            
            <rect x="420" y="140" width="760" height="340" rx="6" fill="#dfe4ea"/>
            <rect x="420" y="140" width="760" height="340" rx="6" fill="none" stroke="#9aa0b5" stroke-width="10"/>
            <g fill="#b8c0cc" opacity="0.7">
              <ellipse cx="620" cy="260" rx="150" ry="40"/><ellipse cx="900" cy="330" rx="200" ry="50"/><ellipse cx="760" cy="410" rx="120" ry="26"/>
            </g>
            <text x="800" y="225" text-anchor="middle" font-family="Arial" font-size="24" fill="#8b93a6" opacity="0.6" id="boardGhost">study group</text>
            <rect x="560" y="480" width="480" height="14" rx="4" fill="#9aa0b5"/>
            <rect x="840" y="470" width="60" height="12" rx="3" fill="#2b3350"/>
          </g>

          <!-- clock (flavor) -->
          <g>
            
            <circle cx="1320" cy="190" r="54" fill="#f3ead8" stroke="#3d4566" stroke-width="8"/>
            <line x1="1320" y1="190" x2="1306" y2="160" stroke="#22263a" stroke-width="6" stroke-linecap="round"/>
            <line x1="1320" y1="190" x2="1280" y2="176" stroke="#22263a" stroke-width="4" stroke-linecap="round"/>
            <circle cx="1320" cy="190" r="4" fill="#e0735a"/>
          </g>

          <!-- lectern (flavor + clue) -->
          <g>
            
            <polygon points="1200,470 1360,470 1340,520 1220,520" fill="#5a4030"/>
            <rect x="1225" y="520" width="110" height="240" fill="#4a3426"/>
            <rect x="1250" y="476" width="70" height="40" fill="#f3ead8" transform="rotate(-6 1285 496)"/>
          </g>

          <!-- desks -->
          <g fill="#3a2c22">
            <polygon points="180,700 470,700 450,740 160,740"/>
            <polygon points="1130,700 1420,700 1440,740 1150,740"/>
            <polygon points="100,800 450,800 430,850 70,850"/>
            <polygon points="1150,800 1500,800 1530,850 1170,850"/>
          </g>
          <g fill="#2b3350"><rect x="200" y="740" width="12" height="60"/><rect x="420" y="740" width="12" height="60"/><rect x="1180" y="740" width="12" height="60"/><rect x="1400" y="740" width="12" height="60"/></g>

          <!-- front desk + lost and found box (hotspot) -->
          <polygon points="560,660 1040,660 1080,720 520,720" fill="#4a3426"/>
          <rect x="540" y="720" width="20" height="120" fill="#2b3350"/><rect x="1040" y="720" width="20" height="120" fill="#2b3350"/>
          <g>
            
            <rect x="690" y="580" width="220" height="90" fill="#b0855a"/>
            <polygon points="690,580 660,548 880,548 910,580" fill="#c69a6c"/>
            <rect x="740" y="605" width="120" height="36" fill="#f3ead8"/>
            <text x="800" y="629" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#22263a">LOST + FOUND</text>
          </g>

          <!-- connecting door 2049 with keypad (hotspot) -->
          <g>
            
            <rect x="1430" y="260" width="150" height="510" fill="#0e1222"/>
            <rect x="1440" y="270" width="130" height="500" fill="#2b3350"/>
            <rect x="1446" y="470" width="44" height="64" rx="4" fill="#0e1222"/>
            <g fill="#9aa0b5"><rect x="1452" y="478" width="8" height="8"/><rect x="1464" y="478" width="8" height="8"/><rect x="1476" y="478" width="8" height="8"/><rect x="1452" y="492" width="8" height="8"/><rect x="1464" y="492" width="8" height="8"/><rect x="1476" y="492" width="8" height="8"/><rect x="1452" y="506" width="8" height="8"/><rect x="1464" y="506" width="8" height="8"/><rect x="1476" y="506" width="8" height="8"/></g>
            <circle id="keypadLed" cx="1468" cy="524" r="4" fill="#e0735a"/>
            <text x="1505" y="300" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#9aa0b5">2049</text>
          </g>
        </svg>