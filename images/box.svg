            <circle cx="1050" cy="640" r="26" fill="#d8ae80"/>
            <path d="M1050 625 l6 12 l13 2 l-10 9 l3 13 l-12 -7 l-12 7 l3 -13 l-10 -9 l13 -2 z" fill="#7a5233"/>
