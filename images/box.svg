<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
          <rect width="1600" height="900" fill="#4f3627"/>
          <g stroke="#432d20" stroke-width="3" opacity="0.6">
            <line x1="0" y1="120" x2="1600" y2="150"/><line x1="0" y1="380" x2="1600" y2="350"/><line x1="0" y1="640" x2="1600" y2="670"/>
          </g>
          <!-- box -->
