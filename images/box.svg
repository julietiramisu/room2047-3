          <g>
            
            <g transform="rotate(4 530 620)">
              <rect x="370" y="530" width="320" height="180" rx="6" fill="#8c3b2e"/>
              <rect x="370" y="530" width="26" height="180" fill="#6b2c22"/>
              <text x="545" y="610" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#f3ead8">The Atlas of</text>
              <text x="545" y="645" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#f3ead8">Small Places</text>
